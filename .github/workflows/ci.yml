name: ci

# The premise of this repository is that hardware, firmware, database, and
# documentation move together. This workflow is what makes that claim checkable
# rather than aspirational. Every job here is also a `make` target, so what CI
# runs and what a contributor runs locally cannot diverge.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agreement:
    name: schema, docs, and ports agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Generated bindings current; Postgres enums match the schema; every
      # document declares a real version; part cross-references resolve; tier
      # budgets match their parts; power sizing covers the load it ships with.
      - run: make drift
      # The browser discriminator scores identically to the Python engine.
      - run: make parity
      # Every internal link resolves, and every document has a route.
      - run: make links

  python:
    name: firmware and discriminator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pinned: an unpinned ruff meant CI resolved a newer version than the
      # author's and failed on rules their local run had never seen.
      - run: pip install --quiet -r requirements-dev.txt
      - run: make test
      - run: make lint-python

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: make lint-web
      - run: make build
