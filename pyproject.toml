# Shared Python tooling for the node agent and the discriminator.
#
# Both are installable packages in their own right, with their own
# pyproject.toml declaring their own dependencies. This file exists only so
# linting and formatting are configured once for the repository rather than
# drifting between the two.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/schema_generated.py"]  # generated by tools/codegen.mjs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # dataclass field(default_factory=...) in defaults is intentional
  "RUF012",  # mutable class attrs are fine in the driver registry
]

[tool.ruff.lint.per-file-ignores]
# These genuinely must import after code runs: each inserts the package
# directory on sys.path first, because the suites are runnable directly
# (`python3 firmware/tests/test_core.py`) as well as under pytest, and the
# packages are not installed in the test environment.
"firmware/tests/**" = ["E402"]
"discriminator/tests/**" = ["E402"]
"tools/gen-fixtures.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
