<svg xmlns="http://www.w3.org/2000/svg" data-parts="pi5-2gb gnss-lc29h cam-hq-imx477 cam-noir-imx477 sdr-rtl-v3 env-bme688 imu-bno085 lwir-mlx90640 psu-usbc-27w storage-microsd-64gb" viewBox="0 0 1240 726" width="1240" height="726" role="img" aria-label="System schematic for the Tier 1 - Baseline node: a power chain of 2 stages, 5 signal buses carrying 9 parts into the host, and the data path off the node"><title>nband Tier 1 - Baseline system schematic</title><desc>Generated from schema/hardware.json. No node has been built and nothing here has been measured.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c3c9d2"/></marker></defs><rect width="1240" height="726" fill="#f7f6f3"/><text x="30" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#20242b">nband Tier 1 - Baseline</text><text x="30" y="63" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#5a616c">System schematic. 10 parts, generated from schema/hardware.json.</text><text x="1210" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="400" fill="#b4453c" text-anchor="end">GENERATED REFERENCE</text><text x="1210" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">No node has been built. Nothing here has been measured.</text><path d="M 30 80 L 1210 80" stroke="#dfe3e9" stroke-width="1" fill="none"/><text x="30" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#8b929c">POWER</text><text x="92" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#8b929c">Raspberry Pi 27 W USB-C power supply</text><rect x="30" y="116" width="373.3333333333333" height="70" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><text x="40" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#20242b">Mains</text><text x="40" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">no autonomy: the node stops when the grid does</text><text x="393.3333333333333" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#20242b" text-anchor="end"></text><path d="M 403.3333333333333 151 L 430.3333333333333 151" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><rect x="433.3333333333333" y="116" width="373.3333333333333" height="70" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><text x="443.3333333333333" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#20242b">27 W USB-C supply</text><text x="443.3333333333333" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">5 A PD profile, negotiated not assumed</text><text x="796.6666666666666" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#20242b" text-anchor="end">5.1 V · 27 W</text><path d="M 806.6666666666666 151 L 833.6666666666666 151" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><rect x="836.6666666666666" y="116" width="373.3333333333333" height="70" rx="5" fill="#ffffff" stroke="#20242b" stroke-width="1.6"/><text x="846.6666666666666" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#20242b">Node load</text><text x="846.6666666666666" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">10.8 W continuous</text><text x="846.6666666666666" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">no pulsed loads declared</text><text x="1200" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#20242b" text-anchor="end">60% headroom</text><path d="M 30 204 L 1210 204" stroke="#dfe3e9" stroke-width="1" fill="none"/><text x="30" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#8b929c">SIGNAL</text><text x="92" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#8b929c">Every part in the tier, on the bus it uses, with the pins it claims.</text><rect x="948" y="236" width="262" height="322" rx="5" fill="#ffffff" stroke="#20242b" stroke-width="1.6"/><text x="962" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#20242b">Raspberry Pi 5, 2GB</text><text x="962" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">One worker thread per channel</text><text x="962" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">Bounded ring buffers: frames are</text><text x="962" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">dropped and counted, never queued</text><text x="962" y="327" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">GNSS-disciplined clock, PPS on pin 7</text><text x="962" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">Coincidence trigger across bands</text><text x="962" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">Append-only spool on the card</text><text x="962" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">Backfills the grid after an outage</text><text x="30" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#20242b">I2C</text><text x="30" y="263" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">shared bus,</text><text x="30" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">3.3 V</text><rect x="106" y="238" width="520" height="21" rx="5" fill="#ffffff" stroke="hsl(180, 45%, 52%)" stroke-width="1"/><text x="116" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">BME688</text><text x="616" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">3V3 17  GND 9  SDA 3  SCL 5</text><path d="M 626 248 L 656 248" stroke="#dfe3e9" stroke-width="1" fill="none"/><rect x="106" y="264" width="520" height="21" rx="5" fill="#ffffff" stroke="hsl(0, 45%, 52%)" stroke-width="1"/><text x="116" y="279" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">BNO085 9-DoF IMU</text><text x="616" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">3V3 17  GND 9  SDA 3  SCL 5</text><path d="M 626 274 L 656 274" stroke="#dfe3e9" stroke-width="1" fill="none"/><rect x="106" y="290" width="520" height="21" rx="5" fill="#ffffff" stroke="hsl(4, 45%, 52%)" stroke-width="1"/><text x="116" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">MLX90640 32x24 thermal array</text><text x="616" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">3V3 17  GND 9  SDA 3  SCL 5</text><path d="M 626 300 L 656 300" stroke="#dfe3e9" stroke-width="1" fill="none"/><path d="M 656 248 L 656 300" stroke="#c3c9d2" stroke-width="1.4" fill="none"/><path d="M 656 274 L 945 274" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><text x="30" y="341" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#20242b">UART</text><text x="30" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">point to</text><text x="30" y="363" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">point</text><rect x="106" y="328" width="520" height="21" rx="5" fill="#ffffff" stroke="hsl(0, 45%, 52%)" stroke-width="1"/><text x="116" y="343" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">LC29H(DA) RTK HAT with PPS</text><text x="616" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">3V3 1  GND 6  TXD-&gt;RXD 10  RXD&lt;-TXD 8  PPS 7</text><path d="M 626 338 L 656 338" stroke="#dfe3e9" stroke-width="1" fill="none"/><path d="M 656 338 L 945 338" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><text x="30" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#20242b">CSI</text><text x="30" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">ribbon to the</text><text x="30" y="421" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">host</text><rect x="106" y="386" width="520" height="21" rx="5" fill="#ffffff" stroke="hsl(150, 45%, 52%)" stroke-width="1"/><text x="116" y="401" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">HQ Camera (IMX477) + 6mm CS lens</text><text x="616" y="401" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">CSI-0 CAM0</text><path d="M 626 396 L 656 396" stroke="#dfe3e9" stroke-width="1" fill="none"/><rect x="106" y="412" width="520" height="21" rx="5" fill="#ffffff" stroke="hsl(20, 45%, 52%)" stroke-width="1"/><text x="116" y="427" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">HQ Camera NoIR + 850nm bandpass</text><text x="616" y="427" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">CSI-1 CAM1</text><path d="M 626 422 L 656 422" stroke="#dfe3e9" stroke-width="1" fill="none"/><path d="M 656 396 L 656 422" stroke="#c3c9d2" stroke-width="1.4" fill="none"/><path d="M 656 409 L 945 409" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><text x="30" y="463" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#20242b">USB</text><text x="30" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">via the hub</text><text x="30" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">when one</text><text x="30" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">ships</text><rect x="106" y="450" width="520" height="21" rx="5" fill="#ffffff" stroke="hsl(205, 45%, 52%)" stroke-width="1"/><text x="116" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">RTL-SDR Blog V3</text><text x="616" y="465" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end">USB 2.0 USB-A</text><path d="M 626 460 L 656 460" stroke="#dfe3e9" stroke-width="1" fill="none"/><path d="M 656 460 L 945 460" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><text x="30" y="521" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#20242b">Not on a bus</text><text x="30" y="533" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">drawn above,</text><text x="30" y="543" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#8b929c">or structural</text><rect x="106" y="508" width="520" height="21" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><text x="116" y="523" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">27 W USB-C power supply</text><text x="616" y="523" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end"></text><rect x="106" y="534" width="520" height="21" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><text x="116" y="549" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="400" fill="#20242b">High Endurance microSDXC 64 GB</text><text x="616" y="549" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c" text-anchor="end"></text><text x="666" y="535" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="400" fill="#8b929c">no bus</text><path d="M 30 586 L 1210 586" stroke="#dfe3e9" stroke-width="1" fill="none"/><text x="30" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600" fill="#8b929c">DATA</text><text x="92" y="602" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="400" fill="#8b929c">What leaves the node, and what happens to it.</text><rect x="30" y="616" width="223.2" height="52" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1" stroke-dasharray="3 3"/><text x="40" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#20242b">Spool</text><text x="40" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5a616c">append-only on the card, survives power loss</text><path d="M 253.2 642 L 266.2 642" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><rect x="269.2" y="616" width="223.2" height="52" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1" stroke-dasharray="3 3"/><text x="279.2" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#20242b">Signed upload</text><text x="279.2" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5a616c">Ed25519 over path, timestamp, nonce, body</text><path d="M 492.4 642 L 505.4 642" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><rect x="508.4" y="616" width="223.2" height="52" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1" stroke-dasharray="3 3"/><text x="518.4" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#20242b">Grid</text><text x="518.4" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5a616c">partitioned Postgres, row-level security</text><path d="M 731.5999999999999 642 L 744.5999999999999 642" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><rect x="747.5999999999999" y="616" width="223.2" height="52" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1" stroke-dasharray="3 3"/><text x="757.5999999999999" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#20242b">Discriminator</text><text x="757.5999999999999" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5a616c">catalogue subtraction, hypothesis scoring</text><path d="M 970.8 642 L 983.8 642" stroke="#c3c9d2" stroke-width="1.3" fill="none" marker-end="url(#a)"/><rect x="986.8" y="616" width="223.2" height="52" rx="5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1" stroke-dasharray="3 3"/><text x="996.8" y="636" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#20242b">Archive</text><text x="996.8" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5a616c">queryable, streamed, exportable with a</text><text x="996.8" y="661" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5a616c">digest</text><text x="30" y="690" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="400" fill="#5a616c">The ladder at the end of that chain stops at &quot;anomalous, unresolved&quot;. No field in this schema can encode &quot;artificial&quot;, and that is deliberate.</text></svg>