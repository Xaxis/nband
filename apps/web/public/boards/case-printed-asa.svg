<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 774 680.5" width="774" height="680.5" role="img" aria-label="Dimensioned drawing of the Printed ASA enclosure, filament for the body and lid: lid plan with 3 windows, body plan, and a section showing the interior height"><title>Printed ASA enclosure, filament for the body and lid</title><defs><marker id="d" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7 z" fill="#8b929c"/></marker></defs><rect width="774" height="680.5" fill="#f7f6f3"/><text x="54" y="28" font-family="system-ui, sans-serif" font-size="14" fill="#20242b" font-weight="600">nband Printed ASA enclosure, filament for the body and lid</text><text x="54" y="43" font-family="system-ui, sans-serif" font-size="9.5" fill="#5a616c">Interior 190 x 145 x 110 mm, 3 mm wall. Drawn for t1, the tier that needs the most apertures. Derived from the registry, never built.</text><text x="720" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#b4453c" text-anchor="end">GENERATED DRAWING</text><text x="54" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8b929c">LID, seen from inside</text><rect x="49.5" y="75.5" width="294" height="226.5" rx="4" fill="none" stroke="#c3c9d2" stroke-width="1"/><rect x="54" y="80" width="285" height="217.5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><rect x="51.75" y="77.75" width="289.5" height="222" fill="none" stroke="#8b929c" stroke-width="1.6" stroke-dasharray="5 3"/><text x="54" y="311.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c">gasket groove, 3 mm cord</text><rect x="66" y="92" width="57.0" height="57.0" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="94.5" cy="120.5" r="25.5" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 69 120.5 L 120 120.5 M 94.5 95 L 94.5 146" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="94.5" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">34 mm</text><text x="106" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="middle">acrylic or tempered glass</text><rect x="141" y="92" width="57.0" height="57.0" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="169.5" cy="120.5" r="25.5" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 144 120.5 L 195 120.5 M 169.5 95 L 169.5 146" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="169.5" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">34 mm</text><rect x="216" y="92" width="37.5" height="37.5" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="234.75" cy="110.75" r="18.75" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 216 110.75 L 253.5 110.75 M 234.75 92 L 234.75 129.5" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="234.75" y="140.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">25 mm</text><text x="234.75" y="150.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="middle">germanium</text><path d="M 54 297.5 L 54 319.5 M 339 297.5 L 339 319.5" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 54 319.5 L 339 319.5" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="196.5" y="316.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">190</text><path d="M 339 80 L 365 80 M 339 297.5 L 365 297.5" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 365 80 L 365 297.5" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="365" y="188.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">145</text><text x="435" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8b929c">BODY, seen from above</text><rect x="430.5" y="75.5" width="294" height="226.5" rx="4" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><rect x="435" y="80" width="285" height="217.5" fill="#f7f6f3" stroke="#c3c9d2" stroke-width="1"/><text x="724.5" y="67.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="end">3 mm wall</text><rect x="447" y="92" width="127.5" height="84.0" fill="#ffffff" stroke="#c3c9d2" stroke-width="0.8"/><rect x="447" y="194" width="120.0" height="40.5" fill="#ffffff" stroke="#c3c9d2" stroke-width="0.8"/><circle cx="459" cy="302" r="9" fill="none" stroke="#b4453c" stroke-width="1.6"/><text x="459" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#b4453c" text-anchor="middle">env 12 mm</text><path d="M 435 327.5 L 435 341.5 M 720 327.5 L 720 341.5" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 435 341.5 L 720 341.5" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="577.5" y="338.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">196 outside</text><text x="54" y="383.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8b929c">SECTION, showing the clearance that sets the height</text><rect x="54" y="405.5" width="285" height="165" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><path d="M 49.5 401 h 294 v 174 h -294 z M 54 405.5 h 285 v 165 h -285 z" fill="#8b929c" fill-rule="evenodd" opacity="0.35"/><rect x="74" y="522.5" width="135.0" height="48.0" fill="#1f5f3a" opacity="0.55" stroke="#20242b" stroke-width="0.6"/><text x="78" y="517.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5a616c">board stack</text><rect x="204" y="405.5" width="60.0" height="72.0" fill="#2a2d33" opacity="0.55" stroke="#20242b" stroke-width="0.6"/><text x="208" y="488.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5a616c">tallest lid part</text><path d="M 339 405.5 L 365 405.5 M 339 570.5 L 365 570.5" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 365 405.5 L 365 570.5" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="365" y="488" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">110</text><path d="M 293 477.5 L 293 477.5 M 293 522.5 L 293 522.5" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 293 477.5 L 293 522.5" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="293" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">30 clear</text><text x="54" y="604.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Wall 3 mm. Groove for a 3 mm cord, inset 1.5 mm from the inside face.</text><text x="54" y="617.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Windows are placed on the parts that look through them, by the same packing rule the node model uses.</text><text x="54" y="630.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Clearance between the stack and the lowest lid part is 30 mm at this interior height.</text><text x="54" y="643.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Nothing here has been printed. Treat every figure as derived rather than measured.</text></svg>