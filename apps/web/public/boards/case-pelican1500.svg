<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1479 956.5" width="1479" height="956.5" role="img" aria-label="Dimensioned drawing of the 1500 case with breather vent and feedthroughs: lid plan with 5 windows, body plan, and a section showing the interior height"><title>1500 case with breather vent and feedthroughs</title><defs><marker id="d" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7 z" fill="#8b929c"/></marker></defs><rect width="1479" height="956.5" fill="#f7f6f3"/><text x="54" y="28" font-family="system-ui, sans-serif" font-size="14" fill="#20242b" font-weight="600">Pelican 1500 case with breather vent and feedthroughs</text><text x="54" y="43" font-family="system-ui, sans-serif" font-size="9.5" fill="#5a616c">Interior 425 x 284 x 155 mm, 4.5 mm wall. Drawn for t3, the tier that needs the most apertures. Derived from the registry, never built.</text><text x="1425" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#b4453c" text-anchor="end">GENERATED DRAWING</text><text x="54" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8b929c">LID, seen from inside</text><rect x="47.25" y="73.25" width="651" height="439.5" rx="4" fill="none" stroke="#c3c9d2" stroke-width="1"/><rect x="54" y="80" width="637.5" height="426" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><rect x="50.625" y="76.625" width="644.25" height="432.75" fill="none" stroke="#8b929c" stroke-width="1.6" stroke-dasharray="5 3"/><text x="54" y="521.375" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c">gasket groove, 3 mm cord</text><rect x="66" y="92" width="57.0" height="57.0" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="94.5" cy="120.5" r="25.5" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 69 120.5 L 120 120.5 M 94.5 95 L 94.5 146" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="94.5" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">34 mm</text><text x="106" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="middle">acrylic or tempered glass</text><rect x="141" y="92" width="57.0" height="57.0" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="169.5" cy="120.5" r="25.5" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 144 120.5 L 195 120.5 M 169.5 95 L 169.5 146" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="169.5" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">34 mm</text><rect x="216" y="92" width="45.0" height="45.0" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="238.5" cy="114.5" r="18.75" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 219.75 114.5 L 257.25 114.5 M 238.5 95.75 L 238.5 133.25" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="238.5" y="144.25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">25 mm</text><text x="238.5" y="154.25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="middle">germanium</text><rect x="279" y="92" width="37.5" height="27.0" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="297.75" cy="105.5" r="18.75" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 279 105.5 L 316.5 105.5 M 297.75 86.75 L 297.75 124.25" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="297.75" y="135.25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">25 mm</text><text x="297.75" y="145.25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="middle">fused silica</text><rect x="334.5" y="92" width="90.0" height="90.0" fill="none" stroke="#dfe3e9" stroke-width="0.8"/><circle cx="379.5" cy="137" r="18.75" fill="none" stroke="#b4453c" stroke-width="1.6"/><path d="M 360.75 137 L 398.25 137 M 379.5 118.25 L 379.5 155.75" stroke="#b4453c" stroke-width="0.5" stroke-dasharray="3 2"/><text x="379.5" y="166.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#b4453c" text-anchor="middle">25 mm</text><text x="379.5" y="176.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="middle">fused silica</text><path d="M 54 506 L 54 528 M 691.5 506 L 691.5 528" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 54 528 L 691.5 528" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="372.75" y="525" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">425</text><path d="M 691.5 80 L 717.5 80 M 691.5 506 L 717.5 506" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 717.5 80 L 717.5 506" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="717.5" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">284</text><text x="787.5" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8b929c">BODY, seen from above</text><rect x="780.75" y="73.25" width="651" height="439.5" rx="4" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><rect x="787.5" y="80" width="637.5" height="426" fill="#f7f6f3" stroke="#c3c9d2" stroke-width="1"/><text x="1431.75" y="65.25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8b929c" text-anchor="end">4.5 mm wall</text><rect x="799.5" y="92" width="127.5" height="84.0" fill="#ffffff" stroke="#c3c9d2" stroke-width="0.8"/><rect x="945" y="92" width="120.0" height="40.5" fill="#ffffff" stroke="#c3c9d2" stroke-width="0.8"/><rect x="1083" y="92" width="82.5" height="82.5" fill="#ffffff" stroke="#c3c9d2" stroke-width="0.8"/><rect x="1183.5" y="92" width="105.0" height="60.0" fill="#ffffff" stroke="#c3c9d2" stroke-width="0.8"/><rect x="799.5" y="194" width="150.0" height="63.0" fill="#ffffff" stroke="#c3c9d2" stroke-width="0.8"/><circle cx="811.5" cy="512.75" r="4.5" fill="none" stroke="#b4453c" stroke-width="1.6"/><text x="811.5" y="530.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#b4453c" text-anchor="middle">acoustic 6 mm</text><circle cx="887.5" cy="512.75" r="9" fill="none" stroke="#b4453c" stroke-width="1.6"/><text x="887.5" y="530.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#b4453c" text-anchor="middle">env 12 mm</text><path d="M 787.5 536 L 787.5 550 M 1425 536 L 1425 550" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 787.5 550 L 1425 550" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="1106.25" y="547" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">434 outside</text><text x="54" y="592" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#8b929c">SECTION, showing the clearance that sets the height</text><rect x="54" y="614" width="637.5" height="232.5" fill="#ffffff" stroke="#c3c9d2" stroke-width="1"/><path d="M 47.25 607.25 h 651 v 246 h -651 z M 54 614 h 637.5 v 232.5 h -637.5 z" fill="#8b929c" fill-rule="evenodd" opacity="0.35"/><rect x="74" y="798.5" width="135.0" height="48.0" fill="#1f5f3a" opacity="0.55" stroke="#20242b" stroke-width="0.6"/><text x="78" y="793.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5a616c">board stack</text><rect x="204" y="614" width="60.0" height="112.5" fill="#2a2d33" opacity="0.55" stroke="#20242b" stroke-width="0.6"/><text x="208" y="737.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#5a616c">tallest lid part</text><path d="M 691.5 614 L 717.5 614 M 691.5 846.5 L 717.5 846.5" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 717.5 614 L 717.5 846.5" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="717.5" y="730.25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">155</text><path d="M 645.5 726.5 L 645.5 726.5 M 645.5 798.5 L 645.5 798.5" stroke="#dfe3e9" stroke-width="0.6"/><path d="M 645.5 726.5 L 645.5 798.5" stroke="#8b929c" stroke-width="0.6" marker-start="url(#d)" marker-end="url(#d)"/><text x="645.5" y="762.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c" text-anchor="middle">48 clear</text><text x="54" y="880.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Wall 4.5 mm. Groove for a 3 mm cord, inset 2.25 mm from the inside face.</text><text x="54" y="893.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Windows are placed on the parts that look through them, by the same packing rule the node model uses.</text><text x="54" y="906.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Clearance between the stack and the lowest lid part is 48 mm at this interior height.</text><text x="54" y="919.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#5a616c">Nothing here has been printed. Treat every figure as derived rather than measured.</text></svg>