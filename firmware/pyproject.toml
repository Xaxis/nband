[project]
name = "nband-node"
version = "0.1.0"
description = "nband node agent: multi-spectral sampling, coincidence triggering, and offline-first delivery to the grid."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
# Installed on a real node. Every one of these is optional at runtime: a driver
# imports its library locally, so a node without a thermal camera does not need
# the thermal library present.
pi = [
  "adafruit-circuitpython-bme680>=3.7",
  "adafruit-circuitpython-mlx90640>=1.3",
  "adafruit-circuitpython-bno08x>=1.2",
  "pyrtlsdr>=0.3",
  "gpiod>=2.1",
  "picamera2>=0.3",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nband-node = "nband_node.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nband_node*"]
